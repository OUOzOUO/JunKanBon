<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>猜猜猜拳 - 爭霸賽修復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-2xl mx-auto grid grid-cols-2 gap-4">
        <div id="setup-screen" class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-amber-500">
            <h1 id="tourney-title" class="text-xl font-bold text-amber-600 mb-4">爭霸賽大廳</h1>
            <div id="lobby-content"></div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-emerald-500">
            <h2 class="font-bold text-emerald-600 mb-4">線上玩家大廳</h2>
            <div id="lobby-user-list"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkqnrJZWo66jXTUmLzs4iA-9HHhAJQ06A",
            authDomain: "junkanbon.firebaseapp.com",
            projectId: "junkanbon",
            databaseURL: "https://junkanbon-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myUid = null, myCurrentName = "玩家_" + Math.floor(Math.random()*1000);
        let currentTid = null;

        // 初始化：確保每個使用者 UID 唯一
        const userRef = db.ref('users').push();
        myUid = userRef.key;
        userRef.set({ name: myCurrentName });
        userRef.onDisconnect().remove();

        // 核心：進入爭霸賽大廳
        function enterTournamentLobby(tid) {
            if (currentTid) db.ref('tournaments/' + currentTid).off();
            currentTid = tid;
        
            // 直接監聽該賽事
            const ref = db.ref('tournaments/' + tid);
            ref.on('value', (s) => {
                const data = s.val();
                if (!data) return;
                
                console.log("收到賽事更新:", data); // 按 F12 查看控制台，看有無收到資料
                
                const isHost = (data.hostUid === myUid);
                const players = Object.values(data.players || {});
                
                // 更新 UI
                document.getElementById('lobby-content').innerHTML = `
                    <p>房號: ${tid}</p>
                    <p>玩家: ${players.map(p => p.name).join(', ')}</p>
                    ${isHost ? `<button onclick="startMatch('${tid}')" class="bg-amber-500 text-white p-2">開始配對</button>` : '<p>等待房主...</p>'}
                `;
            });
        }

        // 核心：開始配對（嚴格清理舊資料）
        function startMatch(tid) {
            db.ref('tournaments/' + tid).once('value', s => {
                const players = Object.keys(s.val().players);
                const updates = {};
                // 清理舊的 matches 路徑
                updates[`tournaments/${tid}/matches`] = null; 
                
                for(let i=0; i<players.length; i+=2) {
                    const matchId = `m${i}`;
                    const p1 = players[i];
                    const p2 = players[i+1] || "BOT_ID";
                    updates[`tournaments/${tid}/matches/${matchId}`] = { 
                        p1_uid: p1, p2_uid: p2, 
                        p1_name: s.val().players[p1].name, 
                        p2_name: p2 === "BOT_ID" ? "電腦AI" : s.val().players[p2].name,
                        status: 'playing', bo3: '0:0' 
                    };
                }
                updates[`tournaments/${tid}/status`] = 'playing';
                db.ref().update(updates);
            });
        }

        // 建立賽事
        function joinTournament(tid) {
            if (!tid) return alert("請輸入房號");
            
            // 檢查是否有這個房間
            db.ref('tournaments/' + tid).once('value', (snap) => {
                if (!snap.exists()) return alert("找不到該賽事！");
                
                // 寫入玩家資料
                db.ref(`tournaments/${tid}/players/${myUid}`).set({ name: myCurrentName })
                .then(() => {
                    console.log("成功加入:", tid);
                    enterTournamentLobby(tid);
                })
                .catch(err => console.error("寫入失敗", err));
            });
        }

        // 加入賽事 (加入前檢查並移除重複資料)
        function joinTournament(tid) {
            db.ref(`tournaments/${tid}/players/${myUid}`).set({ name: myCurrentName })
            .then(() => enterTournamentLobby(tid));
        }

        // 初始化顯示按鈕
        document.getElementById('lobby-content').innerHTML = `
            <button onclick="createTournament()" class="bg-blue-500 text-white w-full py-2 mb-2 rounded">建立爭霸賽</button>
            <input id="join-tid" placeholder="輸入T房號" class="border p-2 w-full mb-2">
            <button onclick="joinTournament(document.getElementById('join-tid').value)" class="bg-green-500 text-white w-full py-2 rounded">加入</button>
        `;
    </script>
</body>
</html>
